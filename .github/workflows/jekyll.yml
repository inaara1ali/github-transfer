name: Deploy Jekyll site with TinaCMS content to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Ruby Engine
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'
          bundler-cache: true

      - name: Build TinaCMS Static Admin
        run: npx tinacms build

      - name: Build Jekyll Site Structure
        run: bundle exec jekyll build
        env:
          JEKYLL_ENV: production

      - name: Upload Build Artifacts
        uses: actions/upload-pages-artifact@v3

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages Live
        id: deployment
        uses: actions/deploy-pages@v4
