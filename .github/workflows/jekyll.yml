name: Automated TinaCMS Sync with GitHub Pages

on:
  push:
    branches: ["main"]

permissions:
  contents: write

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Tree
        uses: actions/checkout@v4

      - name: Setup Node Layout
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Compile TinaCMS Layout Frameworks
        run: npx tinacms build

      - name: Auto Build Site Assets and Push Live
        uses: jeffreytse/jekyll-deploy-action@v0.7.0
        with:
          provider: 'github'
          token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          branch: 'main'
